<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fung Projects</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: Arial, Helvetica, sans-serif;
        background: #080808;
        color: #fff;
    }

    :root {
        --orange: #ff6a00;
        --orange-dark: #cc4f00;
        --card: #111;
        --card2: #171717;
        --border: #292929;
        --muted: #999;
    }

    header {
        height: 70px;
        background: #0d0d0d;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        padding: 0 35px;
        gap: 35px;
        position: sticky;
        top: 0;
        z-index: 100;
    }

    .logo {
        font-size: 25px;
        font-weight: 900;
        color: var(--orange);
        letter-spacing: 2px;
        white-space: nowrap;
    }

    nav {
        display: flex;
        gap: 24px;
        flex: 1;
    }

    nav a {
        color: #aaa;
        text-decoration: none;
        font-size: 14px;
        font-weight: bold;
    }

    nav a:hover {
        color: #fff;
    }

    .top-right {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    #nameInput {
        width: 130px;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 7px;
        background: #151515;
        color: white;
        outline: none;
    }

    #nameInput:focus {
        border-color: var(--orange);
    }

    button {
        border: none;
        cursor: pointer;
        font-weight: bold;
    }

    .create-btn {
        display: none;
        background: var(--orange);
        color: #fff;
        padding: 10px 15px;
        border-radius: 7px;
    }

    .create-btn:hover {
        background: var(--orange-dark);
    }

    .hero {
        padding: 70px 30px 45px;
        text-align: center;
        background:
            radial-gradient(circle at center, #241000 0%, #0b0b0b 55%, #080808 100%);
    }

    .hero h1 {
        font-size: 52px;
        font-weight: 900;
        margin-bottom: 12px;
    }

    .hero h1 span {
        color: var(--orange);
    }

    .hero p {
        color: var(--muted);
        max-width: 650px;
        margin: auto;
        line-height: 1.6;
    }

    .search-container {
        max-width: 850px;
        margin: 30px auto 0;
    }

    #search {
        width: 100%;
        padding: 16px 18px;
        background: #121212;
        color: white;
        border: 1px solid #303030;
        border-radius: 9px;
        outline: none;
        font-size: 15px;
    }

    #search:focus {
        border-color: var(--orange);
    }

    main {
        max-width: 1200px;
        margin: auto;
        padding: 40px 25px 80px;
    }

    .section-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 20px;
    }

    .section-title h2 {
        font-size: 24px;
    }

    .project-count {
        color: #777;
        font-size: 13px;
    }

    .projects {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 20px;
    }

    .project {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        overflow: hidden;
        transition: .2s;
    }

    .project:hover {
        transform: translateY(-4px);
        border-color: #444;
    }

    .project-image {
        height: 155px;
        background:
            linear-gradient(135deg, #241000, #111);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--orange);
        font-size: 34px;
        font-weight: 900;
    }

    .project-content {
        padding: 18px;
    }

    .project h3 {
        font-size: 19px;
        margin-bottom: 8px;
    }

    .description {
        color: #999;
        font-size: 13px;
        line-height: 1.5;
        min-height: 40px;
    }

    .creator {
        margin-top: 14px;
        font-size: 12px;
        color: #777;
    }

    .creator span {
        color: var(--orange);
        font-weight: bold;
    }

    .project-footer {
        margin-top: 17px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .version {
        color: #777;
        font-size: 12px;
    }

    .view-btn {
        background: #222;
        color: white;
        padding: 8px 12px;
        border-radius: 6px;
    }

    .view-btn:hover {
        background: var(--orange);
    }

    .empty {
        text-align: center;
        color: #777;
        padding: 70px 20px;
        display: none;
    }

    .modal-background {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,.8);
        z-index: 500;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }

    .modal {
        width: 100%;
        max-width: 520px;
        background: #111;
        border: 1px solid #303030;
        border-radius: 12px;
        padding: 25px;
    }

    .modal h2 {
        margin-bottom: 20px;
    }

    .form-group {
        margin-bottom: 15px;
    }

    .form-group label {
        display: block;
        margin-bottom: 7px;
        color: #bbb;
        font-size: 13px;
    }

    .form-group input,
    .form-group textarea {
        width: 100%;
        padding: 12px;
        background: #181818;
        color: white;
        border: 1px solid #303030;
        border-radius: 7px;
        outline: none;
        font-family: inherit;
    }

    .form-group textarea {
        resize: vertical;
        min-height: 100px;
    }

    .form-group input:focus,
    .form-group textarea:focus {
        border-color: var(--orange);
    }

    .modal-buttons {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 20px;
    }

    .cancel-btn {
        background: #222;
        color: white;
        padding: 11px 16px;
        border-radius: 7px;
    }

    .submit-btn {
        background: var(--orange);
        color: white;
        padding: 11px 16px;
        border-radius: 7px;
    }

    .submit-btn:hover {
        background: var(--orange-dark);
    }

    footer {
        border-top: 1px solid var(--border);
        padding: 30px;
        text-align: center;
        color: #666;
        font-size: 13px;
    }

    @media (max-width: 750px) {
        header {
            padding: 0 15px;
            gap: 15px;
        }

        nav {
            display: none;
        }

        .hero h1 {
            font-size: 38px;
        }

        #nameInput {
            width: 100px;
        }
    }
</style>
</head>

<body>

<header>
    <div class="logo">FUNG</div>

    <nav>
        <a href="#">Projects</a>
        <a href="#">Community</a>
        <a href="#">Tutorials</a>
        <a href="#">Updates</a>
    </nav>

    <div class="top-right">
        <input
            id="nameInput"
            type="text"
            placeholder="Your name"
            autocomplete="off"
        >

        <button class="create-btn" id="createButton">
            + Create
        </button>
    </div>
</header>

<section class="hero">
    <h1>Welcome to <span>Fung</span></h1>

    <p>
        Discover, share and create projects for the community.
    </p>

    <div class="search-container">
        <input
            id="search"
            type="text"
            placeholder="Search projects..."
        >
    </div>
</section>

<main>
    <div class="section-title">
        <h2>Projects</h2>
        <span class="project-count" id="projectCount"></span>
    </div>

    <div class="projects" id="projects"></div>

    <div class="empty" id="empty">
        No projects found.
    </div>
</main>

<footer>
    Fung Projects © 2026
</footer>

<!-- CREATE PROJECT MODAL -->
<div class="modal-background" id="modalBackground">
    <div class="modal">

        <h2>Create a Project</h2>

        <div class="form-group">
            <label>Project Name</label>
            <input
                id="projectName"
                type="text"
                placeholder="My GTAG Fan Game"
            >
        </div>

        <div class="form-group">
            <label>Description</label>
            <textarea
                id="projectDescription"
                placeholder="Describe your project..."
            ></textarea>
        </div>

        <div class="form-group">
            <label>Version</label>
            <input
                id="projectVersion"
                type="text"
                placeholder="1.0.0"
            >
        </div>

        <div class="modal-buttons">
            <button class="cancel-btn" id="cancelButton">
                Cancel
            </button>

            <button class="submit-btn" id="submitButton">
                Create Project
            </button>
        </div>

    </div>
</div>

<script>
const STORAGE_KEY = "fungProjects_v1";

const defaultProjects = [
    {
        id: 1,
        name: "Ranked 2025",
        description: "A GTAG-style fan game project.",
        version: "1.0.0",
        creator: "Tui"
    }
];

let projects = JSON.parse(localStorage.getItem(STORAGE_KEY));

if (!Array.isArray(projects)) {
    projects = defaultProjects;
    saveProjects();
}

function saveProjects() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(projects));
}

const nameInput = document.getElementById("nameInput");
const createButton = document.getElementById("createButton");
const search = document.getElementById("search");

const modalBackground = document.getElementById("modalBackground");
const cancelButton = document.getElementById("cancelButton");
const submitButton = document.getElementById("submitButton");

const projectName = document.getElementById("projectName");
const projectDescription = document.getElementById("projectDescription");
const projectVersion = document.getElementById("projectVersion");

const projectsContainer = document.getElementById("projects");
const empty = document.getElementById("empty");
const projectCount = document.getElementById("projectCount");

function escapeHTML(text) {
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
}

/*
    ONLY "Tui" can create projects.
*/
function updateCreateButton() {
    const name = nameInput.value.trim();

    if (name.toLowerCase() === "tui") {
        createButton.style.display = "block";
    } else {
        createButton.style.display = "none";
    }
}

nameInput.addEventListener("input", updateCreateButton);

createButton.addEventListener("click", () => {
    if (nameInput.value.trim().toLowerCase() !== "tui") {
        return;
    }

    projectName.value = "";
    projectDescription.value = "";
    projectVersion.value = "";

    modalBackground.style.display = "flex";
    projectName.focus();
});

cancelButton.addEventListener("click", () => {
    modalBackground.style.display = "none";
});

modalBackground.addEventListener("click", (event) => {
    if (event.target === modalBackground) {
        modalBackground.style.display = "none";
    }
});

submitButton.addEventListener("click", () => {
    const creator = nameInput.value.trim();

    if (creator.toLowerCase() !== "tui") {
        alert("Only Tui can create projects.");
        return;
    }

    const name = projectName.value.trim();
    const description = projectDescription.value.trim();
    const version = projectVersion.value.trim() || "1.0.0";

    if (!name) {
        alert("Enter a project name.");
        return;
    }

    if (!description) {
        alert("Enter a project description.");
        return;
    }

    const alreadyExists = projects.some(
        project => project.name.toLowerCase() === name.toLowerCase()
    );

    if (alreadyExists) {
        alert("A project with that name already exists.");
        return;
    }

    const newProject = {
        id: Date.now(),
        name: name,
        description: description,
        version: version,
        creator: "Tui"
    };

    projects.unshift(newProject);

    saveProjects();

    modalBackground.style.display = "none";

    renderProjects();
});

search.addEventListener("input", renderProjects);

function renderProjects() {
    const query = search.value.trim().toLowerCase();

    const filtered = projects.filter(project => {
        return (
            project.name.toLowerCase().includes(query) ||
            project.description.toLowerCase().includes(query) ||
            project.creator.toLowerCase().includes(query)
        );
    });

    projectsContainer.innerHTML = "";

    projectCount.textContent =
        projects.length + (projects.length === 1 ? " project" : " projects");

    if (filtered.length === 0) {
        empty.style.display = "block";
        return;
    }

    empty.style.display = "none";

    filtered.forEach(project => {
        const card = document.createElement("div");
        card.className = "project";

        const firstLetter =
            project.name.charAt(0).toUpperCase();

        card.innerHTML = `
            <div class="project-image">
                ${escapeHTML(firstLetter)}
            </div>

            <div class="project-content">
                <h3>${escapeHTML(project.name)}</h3>

                <div class="description">
                    ${escapeHTML(project.description)}
                </div>

                <div class="creator">
                    Created by
                    <span>${escapeHTML(project.creator)}</span>
                </div>

                <div class="project-footer">
                    <span class="version">
                        v${escapeHTML(project.version)}
                    </span>

                    <button
                        class="view-btn"
                        onclick="viewProject(${project.id})"
                    >
                        View
                    </button>
                </div>
            </div>
        `;

        projectsContainer.appendChild(card);
    });
}

function viewProject(id) {
    const project = projects.find(p => p.id === id);

    if (!project) return;

    alert(
        "Project: " + project.name +
        "\n\n" +
        project.description +
        "\n\nCreated by: " +
        project.creator +
        "\nVersion: " +
        project.version
    );
}

renderProjects();
updateCreateButton();
</script>

</body>
</html>
